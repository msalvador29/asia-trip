<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderboard — Southeast Asia trip planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">🌴</span>
      <div>
        <strong>Wanderboard</strong>
        <small>Southeast Asia, pinned</small>
      </div>
    </div>
    <nav id="chips" class="chips" aria-label="Filter by country"></nav>
    <button id="tripPill" class="trip-pill" data-act="toggle-trip"></button>
  </header>

  <aside id="cityPanel" class="panel city-panel" aria-hidden="true"></aside>
  <aside id="tripPanel" class="panel trip-panel" aria-hidden="true"></aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="cities.js"></script>
  <script src="app.js"></script>
</body>
</html>
